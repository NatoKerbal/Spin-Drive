	}
	rescaleFactor = 1
	NODE
	{
		name = node_stack_top
		transform = node_stack_top
		size = 2
		method = FIXED_JOINT
	}
	NODE
	{
		name = node_stack_bottom
		transform = node_stack_bottom
		size = 2
		method = FIXED_JOINT
	}
	mass = 2.5 // placeholder; tune against stock ISRU's own mass for consistency
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	breakingForce = 400
	breakingTorque = 400
	crashTolerance = 15
	maxTemp = 2000
	TechRequired = exoticNuclearPropulsion // matches SpinDrive/SpinDriveCluster/AstrophageGenerator placement
	entryCost = 1500000
	cost = 40000
	category = Propulsion
	subcategory = 0
	title = Astrophage Breeder Unit
	manufacturer = Project Hail Mary
	description = TODO
	bulkheadProfiles = size2, srf
	attachRules = 1,1,1,1,0
	tags = astrophage breeder
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Astrophage Breeder
		StartActionName = Start Breeding
		StopActionName = Stop Breeding
		ToggleActionName = Toggle Breeding
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false // Astrophage absorbs all heat/radiation, so breeding produces none
		UseSpecialistBonus = false
		INPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.0000289351 // doubles a 10-unit reference tank in 8 KSP-days (6h/day)
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = CarbonDioxide
			Ratio = 0.0000289351 // PLACEHOLDER: 1:1 with Astrophage input, pending real ratio
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 500 // PLACEHOLDER: "reactor-scale" draw, needs playtesting against fuel cell output
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.0000578703 // = 2x input ratio
			DumpExcess = false
		}
	}
}