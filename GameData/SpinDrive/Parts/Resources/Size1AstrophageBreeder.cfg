PART
{
	name = Size1AstrophageBreeder
	module = Part
	author = QuantumsHevy
	MODEL
	{
		model = SpinDrive/Parts/Resources/MiniISRU // The model must be bundled along with this config or the part will not load for some reason. Will probably be easier to handle once an original model is made.
	}
	rescaleFactor = 1
    node_stack_top = 0.0, .9, 0.0, 0.0, 1.0, 0.0, 1
    node_stack_bottom = 0.0, -.9, 0.0, 0.0, -1.0, 0.0, 1
	mass = 1.375 // denser breeding hardware
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	breakingForce = 400
	breakingTorque = 400
	crashTolerance = 7 // matches stock ISRU
	maxTemp = 2000 // matches stock ISRU
	TechRequired = exoticNuclearPropulsion // matches AstrophageGenerator
	entryCost = 750000
	cost = 20000
	category = Utility
	subcategory = 0
	title = APH-125 "Li" Inline Astrophage Breeder
	manufacturer = Project Hail Mary
	description = "While your experiment was crude and clumsy, our scientists have replicated his results. We estimate an eight-day doubling time under optimal conditions. Dr. Grace is right: It is the CO2." - Dr. Orion Li
	bulkheadProfiles = size1, srf
	attachRules = 1,1,1,1,0
	tags = astrophage breeder
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Astrophage Breeder
		StartActionName = Start Breeding
		StopActionName = Stop Breeding
		ToggleActionName = Toggle Breeding
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false // Astrophage absorbs all radiation
		UseSpecialistBonus = false
		INPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.00125483 // 30% net offset of the full-throttle burn rate of SpinDriveCluster (0.020077/sec)
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdMethane
			Ratio = 0.00125483
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = 0.00042576 // CH4 + 2 O2 -> CO2 + 2 H2O by volume, stoichiometric
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 200 // flat draw matching the 1.25m Fission Reactor from Near Future Electrical
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.00250966 // net doubling of input
			DumpExcess = false
		}
		OUTPUT_RESOURCE
		{
			ResourceName = WasteWater
			Ratio = 0.00119381
			DumpExcess = true
		}
	}
}