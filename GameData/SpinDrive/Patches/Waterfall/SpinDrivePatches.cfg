@PART[SpinDrive]:NEEDS[Waterfall]:FOR[SpinDrive]
{
	!EFFECTS {}
	!MODULE[EngineLightEffect] {}
    EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KW/sound_altloop2
				volume = 0.0 0.0
				volume = 0.1 0.3
				volume = 1.0 0.8
				pitch = 0.0 0.7
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = SpinDrive
    engineID = SpinDrive
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
    }
    CONTROLLER
    {
      name = random
      linkedTo = random
      range = -1,1
    }
    TEMPLATE
    {
		templateName = SpinDrive
		overrideParentTransform = thrustTransform
		position = 0,0,0.02
        rotation = 0, 0, 0
        scale = 0.7, 0.5, 1
    }
  }
}

