// Spin Drives
@PART[SpinDrive]:NEEDS[CommunityTechTree]
{
    @TechRequired = plasmaPropulsion
}
@PART[SpinDriveCluster]:NEEDS[CommunityTechTree]
{
    @TechRequired = exoticPlasmaPropulsion
}

// Fuel Cells
@PART[AstrophageGenerator]:NEEDS[CommunityTechTree]
{
    @TechRequired = exoticElectricalSystems
}

// Breeders
@PART[*AstrophageBreeder]:NEEDS[CommunityTechTree]
{
    @TechRequired = exoticFuelStorage
}