// Creates some new VABOrganizer categories
ORGANIZERSUBCATEGORY
{
  name = spinDrives
  Label = Spin Drives
  Priority = 95
  CategoryPriority = 50
}

// Spin Drives
@PART[SpinDrive*]:FOR[SpinDrive]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = spinDrives
  }
}

// Fuel Cells
@PART[AstrophageGenerator]:FOR[SpinDrive]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = fuelCells
  }
}

// Breeders
@PART[*AstrophageBreeder]:FOR[SpinDrive]:NEEDS[VABOrganizer,!VABOrganizer-SheepDog]
{
  %VABORGANIZER
  {
    %organizerSubcategory = resources
  }
}
@PART[*AstrophageBreeder]:FOR[SpinDrive]:NEEDS[VABOrganizer,VABOrganizer-SheepDog]
{
  %VABORGANIZER
  {
    %organizerSubcategory = resourceUtilization
  }
}