PART
{
	name = AstrophageGenerator
	module = Part
	author = NoLifeJordan
  MODEL
	{
		model = SpinDrive/Parts/Generators/AstrophageGenerator
		scale = 1.0, 1.0, 1.0
		rotation = 0, 0, 270
	}
	rescaleFactor = 1

	mass = 0.02

	// heatConductivity = 100.06 // half default
	emissiveConstant = 0.8 // engine nozzles are good at radiating.
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	breakingForce = 400
	breakingTorque = 400
	crashTolerance = 22
	maxTemp = 3600 // = 3600
	TechRequired = precisionPropulsion
	entryCost = 1100
	cost = 200
	category = Electrical
	subcategory = 0
	title =  "Pepper" Astrophage Fuel Cell
	manufacturer = Project Hail Mary
	description = "Perfect energy storage! Imagine a battery-powered household. Like- you have a double-A battery, but full of Astrophage. That'd last your house about a hundred thousand years. Imagine buying a car and never having to charge it up? The entire concept of power grids is going to end." - Dr. Steve Hatch
	bulkheadProfiles = srf
	attachRules = 0,1,0,1,1
	tags = astrophage 
	MODULE
	{
		name = ModuleSystemHeat // 1 ton ~= 1 m^3 of cooling volume
		volume = 0.02
		moduleID = fuelCell
		iconName = Icon_Gears
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		ConverterName = Fuel Cell
		StartActionName = Start Fuel Cell
		StopActionName = Stop Fuel Cell
		ToggleActionName = Toggle Fuel Cell
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false // true via systemHeatModule
		UseSpecialistBonus = false
		INPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.000001
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1000
			DumpExcess = false
		}
		moduleID = fuelCell
		systemHeatModuleID = fuelCell
		shutdownTemperature = 800
		systemOutletTemperature = 500
		systemEfficiency
		{
			key = 0 0.0
			key = 300 1.0
			key = 1000 1.0
			key = 1300 0.0
		}
		// AssumedEfficiency is 0.8 for the cell hardware, not the Astrophage itself. The energy
		// release stays canonically near-lossless. This models conversion losses in the fuel cell
		// itself in turning Astrophage IR output into usable EC.
		//
		// wasteHeat (kW)	= OutputEC * (1 - AssumedEfficiency) / AssumedEfficiency
		//                  = 1000 * (1 - 0.8) / 0.8
		//                  = 250
		//
		// To rebalance, pick a new AssumedEfficiency and redo the division.
		systemPower = 250
	}
}
