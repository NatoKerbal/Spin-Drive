// Creates some new VABOrganizer categories
ORGANIZERSUBCATEGORY
{
  name = spinDrives
  Label = Spin Drives
  Priority = 95
  CategoryPriority = 50
}

// Engines
@PART[SpinDrive,SpinDriveCluster]:FOR[SpinDrive]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = spinDrives
  }
}

// Fuel Cells
@PART[AstrophageGenerator]:FOR[SpinDrive]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = fuelCells
  }
}

// Breeders
@PART[Size2AstrophageBreeder,Size1AstrophageBreeder]:FOR[SpinDrive]:NEEDS[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = resources
  }
}