PART
{
	name = Size2AstrophageBreeder
	module = Part
	author = QuantumsHevy
	MODEL
	{
		model = SpinDrive/Parts/Resources/ISRU // The model must be bundled along with this config or the part will not load for some reason. Will probably be easier to handle once an original model is made.
	}
	rescaleFactor = 1
	node_stack_top = 0.0, 1.5, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -1.5, 0.0, 0.0, -1.0, 0.0, 2
	mass = 5.5 // denser breeding hardware
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	breakingForce = 400
	breakingTorque = 400
	crashTolerance = 7 // matches stock ISRU
	maxTemp = 2000 // matches stock ISRU
	TechRequired = exoticNuclearPropulsion // matches AstrophageGenerator
	entryCost = 1500000
	cost = 40000
	category = Utility
	subcategory = 0
	title = APH-250 "Redell" Inline Astrophage Breeder
	manufacturer = Project Hail Mary
	description = Calling it "breeding" is a bit odd, but what else can you say to describe making two dots of Astrophage from one? After some point, this is literally just making a really volatile meal for a really volatile microorganism.
	bulkheadProfiles = size2, srf
	attachRules = 1,1,1,1,0
	tags = astrophage breeder
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Astrophage Breeder
		StartActionName = Start Breeding
		StopActionName = Stop Breeding
		ToggleActionName = Toggle Breeding
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false // Astrophage absorbs all radiation
		UseSpecialistBonus = false
		INPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.0000072338 // doubles a 10-unit reference in 8 Earth days
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdMethane
			Ratio = 0.0000072338
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = 0.0000024564 // CH4 + 2 O2 -> CO2 + 2 H2O by volume, adjusted for stoichiometry (thanks, chemistry II lab!)
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 500 // reactor-scale power draw (needs playtesting)
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.0000144676 // net doubling
			DumpExcess = false
		}
		OUTPUT_RESOURCE
		{
			ResourceName = WasteWater
			Ratio = 0.0000068818
			DumpExcess = true
		}
	}
}