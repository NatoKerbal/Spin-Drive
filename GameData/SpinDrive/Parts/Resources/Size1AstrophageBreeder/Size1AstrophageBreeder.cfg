PART
{
	name = Size1AstrophageBreeder
	module = Part
	author = QuantumsHevy
	MODEL
	{
		model = SpinDrive/Parts/Resources/Size1AstrophageBreeder/Size1AstrophageBreeder
		rotation = 270, 0, 270
	}
	rescaleFactor = 0.5
	NODE
	{
		name = top
		transform = node_stack_top
		size = 1
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}
	NODE
	{
		name = bottom
		transform = node_stack_bottom
		size = 1
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}
	mass = 1.375 // denser breeding hardware
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	breakingForce = 400
	breakingTorque = 400
	crashTolerance = 7 // matches stock ISRU
	maxTemp = 2000 // matches stock ISRU
	TechRequired = highPerformanceFuelSystems
	entryCost = 20000
	cost = 10000
	category = Utility
	subcategory = 0
	title = PHB-125 "Li" Inline Astrophage Breeder
	manufacturer = Petrova Task Force
	description = "While your experiment was crude and clumsy, our scientists have replicated his results. We estimate an eight-day doubling time under optimal conditions. Dr. Grace is right: It is the CO2." - Dr. Orion Li
	bulkheadProfiles = size1
	attachRules = 1,1,1,1,0
	tags = astrophage breeder
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Astrophage Breeder
		StartActionName = Start Breeding
		StopActionName = Stop Breeding
		ToggleActionName = Toggle Breeding
		FillAmount = 1.0
		AutoShutdown = false
		GeneratesHeat = false // Astrophage absorbs all radiation
		UseSpecialistBonus = false
		INPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.0003125 // Based on a 216-unit reference fuel tank (what could realistically fit inside the breeder)
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdMethane
			Ratio = 0.0003125
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = 0.000106137 // CH4 + 2 O2 -> CO2 + 2 H2O by volume (stoichiometric)
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1000
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = EnrichedAstrophage
			Ratio = 0.000625 // net double of input
			DumpExcess = false
		}
		OUTPUT_RESOURCE
		{
			ResourceName = WasteWater
			Ratio = 0.000297355
			DumpExcess = true
		}
	}
}